name: Lint

# LINT-ADOPT-13 (S-336) — this borough had NO workflow at all, so the ktlint gate
# added to `check` would never run (a gate that cannot run is a false green, the
# S-335 lesson). This workflow is deliberately minimal: one command, no
# `continue-on-error`, no trailing `echo` — the step's exit code IS the gate.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ktlint:
    name: Lint (ktlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api-key-pool-plugin

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ktlintCheck
        run: ./gradlew ktlintCheck --no-daemon --console=plain
