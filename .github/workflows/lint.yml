name: Lint

# LINT-ADOPT-13 (S-336) — this borough had NO workflow at all, so the ktlint gate
# added to `check` would never run (a gate that cannot run is a false green, the
# S-335 lesson). This workflow is deliberately minimal: one command, no
# `continue-on-error`, no trailing `echo` — the step's exit code IS the gate.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ktlint:
    name: Lint (ktlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: cccpeducation/cccp-ci-base@sha256:4722c1bcc71c0343c05257842b774715fc2574ff79182599a29fe8c1361cbeb3
    steps:
      - uses: actions/checkout@v4
      - name: Verify Gradle wrapper version
        uses: cccp-education/conventions-gradle/.github/actions/verify-gradle-wrapper@main

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # GBL-013 US-5 — the runtime image provides JDK 25; `ci/run.sh fast` is the gate.
      - name: ktlintCheck
        run: ci/run.sh fast
